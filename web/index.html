<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f2ed">
  <title>PCBA 排期交付协同平台</title>
  <link rel="stylesheet" href="/assets/style.css?v=20261008-workflow2">
  <link rel="stylesheet" href="/assets/enterprise.css?v=20261008-workflow2">
  <link rel="stylesheet" href="/assets/schedule-list.css?v=20261008-workflow2">
  <link rel="stylesheet" href="/assets/task-workflow.css?v=20261008-workflow2">
  <link rel="stylesheet" href="/assets/visual-refresh.css?v=20261008-account-delete1">
  <script src="/assets/app.js?v=20261008-account-delete2" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">跳转到主内容</a>
  <div id="login" class="login-screen" hidden>
    <div class="login-orb login-orb-top" aria-hidden="true"></div>
    <div class="login-orb login-orb-bottom" aria-hidden="true"></div>
    <div class="login-card">
      <div class="auth-brand-head">
        <img src="/assets/login-logo.jpg" alt="富友昌标志" width="72" height="72">
        <h1>PCBA 排期交付协同平台</h1>
        <p>FYC PCBA Delivery Workbench</p>
      </div>
      <div id="auth-login-panel" class="auth-form-panel">
        <form id="login-form" class="form-stack">
          <label>用户名<input name="username" autocomplete="username" required placeholder="请输入用户名"></label>
          <label>密码<input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></label>
          <p id="login-error" class="inline-error" role="alert" hidden></p>
          <button class="button primary full" type="submit">登 录</button>
        </form>
        <div class="auth-links"><span>没有账号？</span><button id="register-open" class="text-button" type="button">申请注册</button></div>
        <button id="bootstrap-open" class="text-button bootstrap-link" type="button" hidden>首次使用：在本机创建管理员</button>
      </div>
      <div id="auth-register-panel" class="auth-form-panel" hidden>
        <div class="auth-register-head"><button id="register-back" class="text-button" type="button">← 返回登录</button><strong>申请注册账号</strong></div>
        <form id="register-form" class="form-stack">
          <label>用户名 <span class="auth-required">*</span><input name="username" autocomplete="username" minlength="2" maxlength="50" required placeholder="2–50 字符，不能含中文"></label>
          <label>姓名 / 昵称 <span class="auth-required">*</span><input name="display_name" autocomplete="name" required placeholder="供同事识别"></label>
          <label>密码 <span class="auth-required">*</span><input name="password" type="password" autocomplete="new-password" minlength="10" required placeholder="至少 10 位"></label>
          <label>确认密码 <span class="auth-required">*</span><input name="confirm" type="password" autocomplete="new-password" minlength="10" required placeholder="再次输入密码"></label>
          <p id="register-error" class="inline-error" role="alert" hidden></p>
          <p id="register-success" class="inline-success" role="status" hidden></p>
          <button class="button primary full" type="submit">提交注册申请</button>
        </form>
      </div>
      <div class="auth-login-notice" id="auth-login-notice"><strong>登录须知</strong><ul><li>本系统仅供富友昌内部员工使用</li><li>请勿将账号密码透露给他人</li><li>所有操作均记录修改人和时间</li></ul></div>
      <div class="auth-copyright">© 2026 FYC 富友昌 · 内部系统</div>
    </div>
  </div>

  <div id="workspace" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><strong>PCBA 排期</strong><small>交付协同平台</small></div>
      </div>
      <nav id="nav" aria-label="工作台导航">
        <span class="nav-group-label">日常协同</span>
        <button data-view="dashboard" class="nav-item active"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>交付总览</button>
        <button data-view="portfolio" class="nav-item"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V7l7-4 7 4v13M3 20h18M7 10h2m-2 4h2m4-4h2m-2 4h2M17 11l4-2v11"/></svg></span>项目排期</button>
        <button data-view="orders" class="nav-item"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>客户订单</button>
        <button data-view="materials" class="nav-item"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 17l9 5 9-5"/></svg></span>物料齐套</button>
        <button data-view="tasks" class="nav-item"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 11l2 2 4-4M9 17h6"/></svg></span>待办中心<span id="task-count" class="nav-count" hidden></span></button>
        <div class="nav-divider"></div>
        <span class="nav-group-label">数据与管理</span>
        <button data-view="imports" class="nav-item"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg></span>数据导入</button>
        <button data-view="audit" class="nav-item"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>修改记录</button>
        <button data-view="settings" class="nav-item"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="white"/><circle cx="16" cy="12" r="2" fill="white"/><circle cx="10" cy="18" r="2" fill="white"/></svg></span>设置与备份</button>
      </nav>
      <div class="sidebar-foot">
        <span class="connection-dot" id="connection-dot"></span>
        <span id="connection-text">连接中</span>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="breadcrumb"><span>PCBA /</span> <strong id="page-label">交付总览</strong></div>
        <div class="topbar-actions">
          <label class="product-switch-label" for="product-switcher">当前项目<select id="product-switcher" aria-label="切换项目"><option value="">全部项目</option></select></label>
          <span id="data-time" class="data-time"></span>
          <button id="refresh" class="icon-button" title="刷新数据" aria-label="刷新数据"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 1-2.2-5.5M20 4v5h-5"/></svg></button>
          <div class="user-chip"><span id="user-initial">·</span><strong id="user-name">—</strong></div>
          <button id="logout" class="text-button">退出</button>
        </div>
      </header>
      <main id="content" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <div id="modal" class="modal-backdrop" hidden>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><div><p id="modal-kicker" class="eyebrow"></p><h2 id="modal-title"></h2></div><button id="modal-close" class="icon-button" aria-label="关闭">×</button></div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </section>
  </div>
  <div id="node-drawer" class="node-drawer" hidden>
    <div class="node-drawer-backdrop" aria-hidden="true"></div>
    <section class="node-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="node-drawer-title">
      <header class="node-drawer-head"><div><p class="eyebrow">项目节点</p><h2 id="node-drawer-title">节点排期</h2><p id="node-drawer-subtitle"></p></div><button id="node-drawer-close" class="icon-button" type="button" aria-label="关闭节点">×</button></header>
      <div id="node-drawer-body" class="node-drawer-body"></div>
      <footer class="node-drawer-actions"><button id="node-drawer-detail" class="button" type="button">查看物料与完整批次</button><button id="node-drawer-dismiss" class="button primary" type="button">返回项目列表</button></footer>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
